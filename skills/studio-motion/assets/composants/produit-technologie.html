<!-- MODÈLE STUDIO MOTION : un produit relié à une technologie. À changer : 'Même logique', 'Le produit', 'La technologie', le titre de chatWin (dans lib.js) et les temps. -->
<script>window.CHARTE = { accent: '#04529A' };   // <- ta couleur d'accent</script>
<script src="lib.js"></script><script>
// C, short 6.14 - 10.69 (local): "Eh bien, de la même manière (.71), ChatGPT (1.42) utilise (1.72) de l'intelligence (2.22)
// artificielle (2.81) pour fonctionner (3.89)." Product (chat window) left, technology (IA core) right; a cable connects
// them, current flows from the core into the app, the app types and answers.
page(t => {
  let h = '';
  h += chip(540, 110, 'Même logique', OS(t - .65, 12, .45), K, W, 36);
  const L = 280, R = 805, Y = 430;
  const cw = OS(t - 1.35, 11, .45);
  if (cw > 0) { h += shadowEl(L, Y + 175, 160 * cw, .08 * cw); h += chatWin(L, Y, 1.0 * cw, cl((t - 3.2) / .2), E((t - 3.85) / .5), t); }
  h += riseText(1.6, t, L, Y + 225, 'Le produit', 44, 800, K);
  const ia = OS(t - 2.15, 10, .45);
  if (ia > 0) h += iaCore(R, Y, .85, ia, t);
  h += riseText(2.75, t, R, Y + 225, 'La technologie', 44, 800, B);
  const d = `M${R - 130} ${Y} C ${R - 220} ${Y + 90}, ${L + 260} ${Y + 90}, ${L + 172} ${Y}`;
  h += cable(d, 340, E((t - 1.75) / .5), cl((t - 2.8) / .3), t, 10);
  h += ring(L, Y, 170, 330, 3.85, t);
  return h;
});
